# Listen on the standard MQTT port
listener 1883 0.0.0.0

# Allow connections without a username/password (for local testing)
allow_anonymous true

# Enable persistence to save messages and subscriptions between restarts
persistence true
persistence_location /broker/mosquitto/data/

# Output logs to both the console and a log file
log_dest stdout
log_dest file /broker/mosquitto/log/mosquitto.log